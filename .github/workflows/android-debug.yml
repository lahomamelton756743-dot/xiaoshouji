name: Build Android Debug APK
# v0.8.5-7 move chat header upward

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Diagnose Android build prerequisites
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Android SDK: $ANDROID_HOME"
          java -version
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/34.0.0/d8"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -f android/signing/zhangxinchuang-public-release.p12
          ls -lh android/signing/zhangxinchuang-public-release.p12

      - name: Build APK
        run: bash android/build.sh

      - name: Verify APK exists
        run: |
          ls -lh android/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhangxinchuang-public-debug-apk
          path: android/*.apk
          if-no-files-found: error
          retention-days: 14
