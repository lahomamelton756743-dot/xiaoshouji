name: Build Guiqi Home APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-guiqi-home.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/home-app-v01
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build signed home APK
        run: |
          chmod +x android/build.sh
          cd android
          ./build.sh
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Guiqi-Home-v0.8.5-34
          path: android/Guiqi-v0.8.5-18.apk
          if-no-files-found: error
