name: 构建小手机 APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-little-phone-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 构建 APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/build.sh
          ./android/build.sh

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: little-phone-apk
          path: android/LittlePhone-v0.8.2-fix2.apk
          if-no-files-found: error
