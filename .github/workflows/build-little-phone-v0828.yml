name: Build Little Phone v0.8.4-11

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-little-phone-v0828.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed APK
        shell: bash
        run: |
          chmod +x android/build.sh
          cd android
          ./build.sh

      - name: Create user ZIP
        shell: bash
        run: |
          cd android
          zip -j "$GITHUB_WORKSPACE/little-phone-v0.8.4-11-build.zip" LittlePhone-v0.8.4-11.apk

      - name: Upload APK and ZIP
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: little-phone-v0.8.4-11-build
          path: |
            android/LittlePhone-v0.8.4-11.apk
            little-phone-v0.8.4-11-build.zip
          retention-days: 30
          if-no-files-found: error

      - name: Publish build pointer
        if: always()
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          cat > BUILD-v0.8.4-11.txt <<EOF
          version=0.8.4-11
          job_status=${{ job.status }}
          commit=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          artifact_id=${ARTIFACT_ID}
          artifact_url=${ARTIFACT_URL}
          zip=little-phone-v0.8.4-11-build.zip
          apk=LittlePhone-v0.8.4-11.apk
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD-v0.8.4-11.txt
          git commit -m "build: publish v0.8.4-11 artifact pointer" || true
          git push || true
