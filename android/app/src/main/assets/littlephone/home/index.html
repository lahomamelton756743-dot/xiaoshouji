<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>家 · 归栖</title>
<style>
:root{font-family:system-ui,"Noto Sans SC",sans-serif;color:#6c5149;background:#f7eee3}*{box-sizing:border-box}body{margin:0}.app{max-width:500px;min-height:100dvh;margin:auto;background:#f8eee2;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 10px}.top h1{font-size:23px;margin:0}.top small{color:#9b8173}.btn{border:0;border-radius:18px;padding:10px 14px;background:#fff8f0;color:#76594c;box-shadow:0 2px 10px #694b3220}.scene{position:relative;margin:8px 12px;flex:1;min-height:450px;border-radius:24px;overflow:hidden;background:linear-gradient(#f5dfca 0 46%,#cfae8e 46% 100%);box-shadow:inset 0 0 0 2px #e5c7a8}.wall{position:absolute;inset:0 0 54%;background:repeating-linear-gradient(90deg,#f7e5d4 0 52px,#f2dcc8 53px 55px)}.floor{position:absolute;inset:46% 0 0;background:repeating-linear-gradient(150deg,#d4b08d 0 36px,#cda682 37px 39px)}.window{position:absolute;top:10%;right:8%;width:33%;height:29%;border:9px solid #b98f72;border-radius:8px;background:linear-gradient(#9fc4d9,#f2d8b2);box-shadow:0 6px 0 #d1a889}.window:after{content:"";position:absolute;top:0;bottom:0;left:48%;border-left:6px solid #b98f72}.sofa{position:absolute;top:39%;left:8%;width:48%;height:24%;border-radius:28px 28px 14px 14px;background:#ebd3b6;border:8px solid #c7a68a;box-shadow:0 12px 0 #a88065}.table{position:absolute;top:67%;left:30%;width:42%;height:12%;border-radius:50%;background:#ac7d59;box-shadow:0 10px 0 #8e684d}.rug{position:absolute;top:61%;left:12%;width:78%;height:30%;border-radius:50%;background:#ead9c066}.plant{position:absolute;top:33%;left:3%;font-size:48px}.avatar{position:absolute;bottom:15%;width:52px;transform:translate(-50%,0);transition:left .8s linear,bottom .8s linear;z-index:5;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 5px 3px #5d443550)}.avatar .head{width:33px;height:37px;background:#f0c5a7;border-radius:44% 44% 48% 48%;position:relative;z-index:2}.avatar .hair{position:absolute;top:-8px;width:39px;height:20px;background:#342a2b;border-radius:60% 55% 30% 25%}.avatar .eyes{position:absolute;top:19px;left:8px;font-size:10px;letter-spacing:4px;color:#473432}.avatar .body{height:56px;width:35px;border-radius:12px 12px 7px 7px;background:#293448;position:relative}.avatar .body:after{content:"✦";position:absolute;top:12px;left:12px;color:#f3c98c}.avatar .legs{height:32px;width:29px;background:linear-gradient(90deg,#30354b 47%,transparent 47% 53%,#30354b 53%);border-radius:0 0 5px 5px}.avatar.her{width:45px}.avatar.her .head{width:32px;height:36px}.avatar.her .hair{top:-5px;width:36px;height:70px;border-radius:50% 50% 30% 30%;background:#63463e;z-index:0}.avatar.her .head{z-index:1}.avatar.her .body{z-index:1;background:#fff6e6;height:46px;width:32px}.avatar.her .body:after{content:"✧";color:#c9a27d}.avatar.her .legs{height:25px;background:linear-gradient(90deg,#f4e8d6 47%,transparent 47% 53%,#f4e8d6 53%)}.avatar.him{left:42%}.avatar.her{left:61%}.speech{position:absolute;bottom:33%;left:45%;z-index:7;background:#fffaf4;border-radius:18px;padding:8px 12px;box-shadow:0 3px 10px #654b3225;max-width:55%;font-size:12px}.bottom{display:flex;gap:8px;justify-content:space-around;padding:12px 12px 22px}.bottom button{flex:1}.overlay{position:absolute;inset:0;background:#4a302a77;z-index:10;display:grid;place-items:center;padding:22px}.panel{background:#fff8ef;border-radius:24px;padding:20px;width:100%;max-width:360px}.panel h2{margin:0 0 14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}.hint{text-align:center;font-size:12px;color:#9b8173;padding:4px}
</style></head><body><main class="app"><header class="top"><div><h1>我们的家</h1><small id="clock"></small></div><button class="btn" id="rooms">⌂ 房屋</button></header><div class="scene" id="scene" aria-label="可点击移动的房间"><div class="wall"></div><div class="floor"></div><div class="window" id="window"></div><div class="rug"></div><div class="sofa" data-furniture="沙发"></div><div class="table" data-furniture="茶几"></div><div class="plant">🪴</div><div class="avatar him" id="him" role="button" aria-label="顾知归"><div class="head"><div class="hair"></div><span class="eyes">••</span></div><div class="body"></div><div class="legs"></div></div><div class="avatar her" id="her" role="button" aria-label="你"><div class="head"><div class="hair"></div><span class="eyes">••</span></div><div class="body"></div><div class="legs"></div></div><div class="speech" id="speech">欢迎回家。</div></div><div class="hint" id="hint">点击地面走动 · 点击顾知归互动</div><nav class="bottom"><button class="btn" id="person">♡ 互动</button><button class="btn" id="roomLabel">客厅</button><button class="btn" id="mute">♫ 音效关</button></nav><div class="overlay hidden" id="overlay"><div class="panel"><h2 id="panelTitle">选择</h2><div class="choices" id="choices"></div><p><button class="btn" id="close">返回</button></p></div></div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const KEY='guiqi.home.v01';const rooms=['客厅','卧室','厨房','浴室'];let state;try{state={room:0,x:61,sound:false,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={room:0,x:61,sound:false}};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};const say=s=>{$('speech').textContent=s};function render(){$('roomLabel').textContent=rooms[state.room];$('her').style.left=state.x+'%';$('mute').textContent=state.sound?'♫ 音效开':'♫ 音效关';const palettes=[['#f5dfca','#cfae8e'],['#ead9df','#b99a94'],['#f0dfbd','#d2aa80'],['#e0e9e4','#b2c6bd']];$('scene').style.background='linear-gradient('+palettes[state.room][0]+' 0 46%,'+palettes[state.room][1]+' 46% 100%)';save()}function menu(title,items){$('panelTitle').textContent=title;$('choices').replaceChildren();items.forEach(([label,fn])=>{const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=()=>{hide();fn()};$('choices').append(b)});$('overlay').classList.remove('hidden')}function hide(){$('overlay').classList.add('hidden')}function interact(){menu('和顾知归一起',[['牵手',()=>say('他走过来，轻轻牵住你的手。')],['拥抱',()=>say('他俯下身，把你抱进怀里。')],['一起坐下',()=>say('你们一起坐在沙发上。')],['说说话',()=>say('他看向你：今天想做什么？')]])}function chooseRoom(){menu('房屋总览',rooms.map((r,i)=>[r,()=>{state.room=i;render();say('来到'+r+'。')}]))}$('scene').addEventListener('click',e=>{if(e.target.closest('#him')){interact();return}const f=e.target.closest('[data-furniture]');if(f){say(f.dataset.furniture+'：可以在这里休息或互动。');return}if(e.target.closest('#her'))return;const r=$('scene').getBoundingClientRect();state.x=Math.max(10,Math.min(90,100*(e.clientX-r.left)/r.width));render();say('慢慢走过去……')});$('person').onclick=interact;$('rooms').onclick=chooseRoom;$('roomLabel').onclick=chooseRoom;$('close').onclick=hide;$('overlay').onclick=e=>{if(e.target===$('overlay'))hide()};$('mute').onclick=()=>{state.sound=!state.sound;render();say(state.sound?'音效已开启（音频素材待接入）':'音效已关闭')};function clock(){const d=new Date();$('clock').textContent=d.toLocaleString('zh-CN',{month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,60000);render()})();
</script></body></html>
