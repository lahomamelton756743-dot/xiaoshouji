<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const KEY='guiqi.home.v01';const rooms=['客厅','卧室','厨房','浴室'];let state;try{state={room:0,x:61,sound:false,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={room:0,x:61,sound:false}};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};const say=s=>{$('speech').textContent=s};function render(){$('roomLabel').textContent=rooms[state.room];$('her').style.left=state.x+'%';$('mute').textContent=state.sound?'♫ 音效开':'♫ 音效关';const palettes=[['#f5dfca','#cfae8e'],['#ead9df','#b99a94'],['#f0dfbd','#d2aa80'],['#e0e9e4','#b2c6bd']];$('scene').style.background='linear-gradient('+palettes[state.room][0]+' 0 46%,'+palettes[state.room][1]+' 46% 100%)';save()}function menu(title,items){$('panelTitle').textContent=title;$('choices').replaceChildren();items.forEach(([label,fn])=>{const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=()=>{hide();fn()};$('choices').append(b)});$('overlay').classList.remove('hidden')}function hide(){$('overlay').classList.add('hidden')}function interact(){menu('和顾知归一起',[['牵手',()=>say('他走过来，轻轻牵住你的手。')],['拥抱',()=>say('他俯下身，把你抱进怀里。')],['一起坐下',()=>say('你们一起坐在沙发上。')],['说说话',()=>say('他看向你：今天想做什么？')]])}function chooseRoom(){menu('房屋总览',rooms.map((r,i)=>[r,()=>{state.room=i;render();say('来到'+r+'。')}]))}$('scene').addEventListener('click',e=>{if(e.target.closest('#him')){interact();return}const f=e.target.closest('[data-furniture]');if(f){say(f.dataset.furniture+'：可以在这里休息或互动。');return}if(e.target.closest('#her'))return;const r=$('scene').getBoundingClientRect();state.x=Math.max(10,Math.min(90,100*(e.clientX-r.left)/r.width));render();say('慢慢走过去……')});$('person').onclick=interact;$('rooms').onclick=chooseRoom;$('roomLabel').onclick=chooseRoom;$('close').onclick=hide;$('overlay').onclick=e=>{if(e.target===$('overlay'))hide()};$('mute').onclick=()=>{state.sound=!state.sound;render();say(state.sound?'音效已开启（音频素材待接入）':'音效已关闭')};function clock </script></body></html>
