name = "little-phone-backend"
main = "worker.js"
compatibility_date = "2026-09-01"

# 继续使用你已有的 D1 即可；Worker 会自动创建 lp_* 表，不会覆盖旧表。
[[d1_databases]]
binding = "DB"
database_name = "linjian-peek"
database_id = "把你现有 D1 database_id 填在这里"

# 可选：日常册照片。暂时不配也不影响信、纸条、留痕、待办、来访测试。
# [[r2_buckets]]
# binding = "LITTLEPHONE_MEDIA"
# bucket_name = "little-phone-media"

# Token 不写在这个文件里。部署前执行：
# npx wrangler secret put LINJIAN_TOKEN
